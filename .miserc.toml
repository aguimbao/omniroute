{% if env.MISE_SCOPE == "app" %}
env = ["proton-pass", "fnox", "app"]
{% elif env.MISE_SCOPE == "ci-lint" %}
env = ["node", "lint"]
{% elif env.MISE_SCOPE == "ci-test" %}
env = ["proton-pass", "fnox", "orchestration", "app"]
{% elif env.MISE_SCOPE == "ci-renovate" %}
env = ["proton-pass", "fnox", "node", "github-app-ci-renovate"]
{% elif env.MISE_SCOPE == "ci-release-please" %}
env = ["proton-pass", "fnox", "node", "github-app-ci-release-please"]
{% elif env.MISE_SCOPE == "ci-cleanup-packages" %}
env = ["proton-pass", "fnox", "github-package-cleanup"]
{% else %}
env = [
  "proton-pass",
  "fnox",
  "node",
  "lint",
  "orchestration",
  "dev",
]
{% endif %}
