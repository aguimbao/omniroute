[daemons.omniroute-redis]
run = "podman run --replace --name omniroute-redis --network omniroute-net -p 127.0.0.1:6379:6379 -v omniroute-redis-data:/data docker.io/library/redis:alpine redis-server --save 60 1 --loglevel warning"
ready_cmd = "podman exec omniroute-redis redis-cli ping | grep -q PONG"

[daemons.omniroute-omniroute]
depends = ["omniroute-redis"]
dir = "."
ready_cmd = "podman healthcheck run omniroute-omniroute"
run = '''
nu -c '
let creds = (fnox get PROTON_PASS_CREDENTIALS | complete)
let pat_args = if ($creds.exit_code == 0 and ($creds.stdout | str trim) == "true") {
  let resolved = (fnox get OMNIROUTE_PROTON_PASS_PAT | complete)
  if $resolved.exit_code == 0 {
    ["-e", $"OMNIROUTE_PROTON_PASS_PAT=($resolved.stdout | str trim)"]
  } else {
    []
  }
} else {
  []
}
podman run --replace --name omniroute-omniroute --network omniroute-net --stop-timeout 40 --health-cmd "node healthcheck.mjs" --health-interval 30s --health-timeout 5s --health-retries 3 --health-start-period 15s -e NODE_ENV=production -e DATA_DIR=/app/data -e REDIS_URL=redis://omniroute-redis:6379 -e LIVE_WS_HOST=0.0.0.0 -e LIVE_WS_ALLOWED_ORIGINS=http://localhost:20128,http://127.0.0.1:20128 -p 20128:20128 -p 20132:20132 -v omniroute-data:/app/data -v $"($env.PWD)/fnox.toml:/app/fnox.toml:ro,Z" ...$pat_args localhost/omniroute:latest
'
'''

[daemons.omniroute-dev-redis]
run = "podman run --replace --name omniroute-dev-redis --network omniroute-dev-net -p 127.0.0.1:6389:6379 -v omniroute-dev-redis-data:/data localhost/redis:dev redis-server --save 60 1 --loglevel warning"
ready_cmd = "podman exec omniroute-dev-redis redis-cli ping | grep -q PONG"

