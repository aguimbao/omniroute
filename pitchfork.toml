}
podman run --replace --name omniroute-test-app --network omniroute-test-net --stop-timeout 40 --health-cmd "node healthcheck.mjs" --health-interval 30s --health-timeout 5s --health-retries 3 --health-start-period 15s -e NODE_ENV=production -e DATA_DIR=/app/data -e REDIS_URL=redis://omniroute-test-redis:6379 -e LIVE_WS_HOST=0.0.0.0 -e LIVE_WS_ALLOWED_ORIGINS=http://localhost:20228,http://127.0.0.1:20228 -p 20228:20128 -p 20232:20132 -v omniroute-test-app-data:/app/data -v $"($env.PWD)/fnox.toml:/app/fnox.toml:ro,Z" ...$pat_args localhost/omniroute:test
