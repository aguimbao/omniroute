name: cleanup-packages

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        # zizmor: ignore[cache-poisoning]
        with:
          cache: true
          install: false

      - name: Setup tools
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        run: mise run setup --pass-cli-login

      - name: Fetch token from Proton Pass
        id: fnox-token
        run: |
          token=$(fnox get RENOVATE_TOKEN -P omniroute-dev)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Prune old GHCR image versions
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          token: ${{ steps.fnox-token.outputs.token }}
          image-names: omniroute
          tag-selection: both
          cut-off: 1d
          keep-n-most-recent: 10
