[tools]
hk = { version = '1.57.0', postinstall = 'hk install' }
actionlint = '1.7.12'
hadolint = '2.15.1'
oxlint = '1.81.0'
'aqua:oxc-project/oxc/oxfmt' = '1.81.0'
zizmor = '1.30.1'
typos = '1.50.0'
'aqua:tombi-toml/tombi' = '1.5.0'
'npm:@commitlint/cli' = '21.2.2'
'npm:renovate' = { version = '44.52.1', bun_args = '--trust' }
markdownlint-cli2 = '0.23.2'
'aqua:wasilibs/go-yamllint' = '1.38.0'
pkl = '0.32.1'

[tasks.lint]
description = 'Run all code quality checks via hk'
shell = 'nu -c'
run = '''
if ($env.GH_TOKEN? | is-not-empty) or ($env.GITHUB_TOKEN? | is-not-empty) {
  hk check --all
} else if (which fnox | is-not-empty) {
  fnox exec -P github --if-missing ignore -- hk check --all
} else {
  hk check --all
}
'''

[tasks.fmt]
description = 'Fix formatting and linting errors via hk'
shell = 'nu -c'
run = '''
if ($env.GH_TOKEN? | is-not-empty) or ($env.GITHUB_TOKEN? | is-not-empty) {
  hk fix --all
} else if (which fnox | is-not-empty) {
  fnox exec -P github --if-missing ignore -- hk fix --all
} else {
  hk fix --all
}
'''
