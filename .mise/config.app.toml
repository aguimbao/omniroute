[env]
FNOX_PROFILE = '{% if env.FNOX_PROFILE %}{{ env.FNOX_PROFILE }},{% endif %}omniroute'

[tasks.provision]
description = 'Waits for server healthcheck, then runs automatic provider provisioning against the management API. Non-fatal, idempotent'
shell = 'nu -c'
run = '''
const MAPPING = [
    {provider: "antigravity", oauth: "antigravity"}
    {provider: "codex", oauth: "codex"}
    {env: "ANTHROPIC_API_KEY", provider: "anthropic"}
    {env: "OPENROUTER_API_KEY", provider: "openrouter"}
    {env: "OPENCODE_ZEN_API_KEY", provider: "opencode-zen"}
    {env: "NVIDIA_NIM_API_KEY", provider: "nvidia"}
    {env: "TOKENROUTER_API_KEY", provider: "tokenrouter", psd: {consoleApiKey: "TOKENROUTER_MANAGEMENT_KEY"}}
    {env: "ORCAROUTER_API_KEY", provider: "orcarouter"}
]

const MODEL_COMBOS = []

# Visible catalog (modelVisibilityAllowlist) plus per-model overrides of what /v1/models reports.
# Only fields that differ from OmniRoute's own metadata are set.
const VISIBLE_MODELS = {
    antigravity: {
        "gemini-3.8-flash-tiered": {efforts: [low medium high]}
        "gemini-4-hydrogen-sonar": {context: 1048576, output: 262144}
    }
    nvidia: {
        "moonshotai/kimi-k3.1-pro": {output: 65536, efforts: [low medium high max]}
        "minimaxai/minimax-m3.1-flash": {context: 262144, output: 262144}
        "z-ai/glm-5.3-flash": {context: 1000000, output: 131072, efforts: [low high max]}
    }
    "opencode-zen": {
        "tidepool-alpha-free": {context: 1048576, output: 131072, efforts: [low medium high xhigh max]}
        "beam-free": {context: 1048576, output: 131072, efforts: [low medium high xhigh max]}
        "deepseek-v4.1-flash-free": {context: 200000, output: 32000, efforts: [low high max]}
        "mimo-v2.6-flash-free": {context: 200000, output: 32000}
    }
    orcarouter: {
        "tencent/hy4-preview-free": {context: 1000000, output: 65536, efforts: [low high]}
        "deepseek/deepseek-v4.1-flash-free": {context: 1000000, output: 384000, efforts: [low high max]}
        "tencent/hy3-free": {context: 256000, output: 128000}
        "z-ai/glm-5.3-flash-free": {context: 1000000, output: 128000, efforts: [low high max]}
    }
    codex: {
        "gpt-6.2-sol": {output: 128000, efforts: [low medium high xhigh max ultra]}
        "gpt-6.2-astra": {output: 128000, efforts: [low medium high xhigh max ultra]}
        "gpt-6.1-terra": {output: 128000, efforts: [low medium high xhigh max ultra]}
        "gpt-6-luna": {}
    }
    anthropic: {
        "claude-fable-5-2": {efforts: [low medium high xhigh max]}
        "claude-opus-5-5": {}
        "claude-sonnet-5-5": {}
        "claude-haiku-5-5": {}
    }
}

const OVERRIDE_KEYS = [[field key]; [context context_length] [output max_output_tokens] [efforts reasoning_efforts]]

def usable [raw: string] {
    let v = $raw | str trim
    if ($v | is-empty) { return false }
    if ($v =~ '(?i)^(placeholder|replace_with|change_me)') { return false }
    if ($v | str contains 'pass://') { return false }
    true
}

def extra-psd [m: record] {
    $m | get -o psd | default {} | items {|field, env_name|
        {field: $field, value: ($env | get -o $env_name | default "" | str trim)}
    } | where {|r| usable $r.value } | reduce --fold {} {|r, acc| $acc | merge {($r.field): $r.value}}
}

def find-auto [conns: list, provider: string] {
    $conns | where {|c| ($c | get -o provider) == $provider and ($c | get -o name) == "auto" and (($c | get -o authType | default "") in ["apikey" ""])} | get -o 0
}

def restore-oauth [base: string, headers: record] {
    if ($env.OMNIROUTE_RESTORE_CONNECTIONS? | default "") != "true" { return }
    let raw = ($env.OMNIROUTE_CONNECTIONS? | default "" | str trim)
    if ($raw | is-empty) {
        print "[provision] no OAuth connections backup stored — skipping restore"
        return
    }
    let saved = ($raw | from json)
    let existing = (http get --headers $headers $"($base)/api/providers" | get -o connections | default [])

    for m in ($MAPPING | where {|m| ($m | get -o oauth) != null }) {
        let known = ($existing | where {|c| ($c | get -o provider) == $m.provider} | each {|c| $c | get -o email | default ""})
        for e in ($saved | get -o $m.provider | default []) {
            if $e.email in $known {
                print $"[provision] ($m.provider): ($e.email) already connected — skipping restore"
                continue
            }
            try {
                let res = (match $m.oauth {
                    "codex" => {
                        http post --content-type application/json --headers $headers $"($base)/api/oauth/codex/import" {accounts: [$e]}
                    }
                    "antigravity" => {
                        http post --content-type application/json --headers $headers $"($base)/api/oauth/antigravity/import-token" {token: $e.refreshToken}
                    }
                })
                let summary = ($res | to json --raw | str substring 0..400)
                if ($res | get -o success | default true) == false {
                    print $"[provision] ($m.provider): ($e.email) restore FAILED — ($summary)"
                } else {
                    print $"[provision] ($m.provider): ($e.email) restored from backup — ($summary)"
                }
            } catch {|err|
                print $"[provision] ($m.provider): ($e.email) restore FAILED — ($err.msg | str substring 0..800)"
            }
        }
    }
}

def do-provision [] {
    let port = $env.PORT? | default 20128
    let base = $"http://127.0.0.1:($port)"
    let key = $env.OMNIROUTE_API_KEY? | default "" | str trim

    if not (usable $key) {
        print "[provision] OMNIROUTE_API_KEY is not usable — skipping"
        return
    }

    let headers = {
        Authorization: $"Bearer ($key)"
        Content-Type: "application/json"
    }

    mut all = []
    mut listed = false
    for list_try in 1..5 {
        try {
            $all = (http get --headers $headers $"($base)/api/providers" | get -o connections | default [])
            $listed = true
            break
        } catch {|err|
            print $"[provision] initial list connections attempt ($list_try)/5 FAILED — ($err.msg | str substring 0..400)"
            if $list_try < 5 { sleep 2sec }
        }
    }

    if not $listed {
        print "[provision] could not list connections upfront — skipping key upserts to prevent duplicates"
        return
    }

    for m in $MAPPING {
        let env_name = ($m | get -o env | default "")
        if ($env_name | is-empty) {
            print $"[provision] ($m.provider): no env mapping — skipping key upsert"
            continue
        }
        let value = ($env | get -o $env_name | default "")
        if not (usable $value) {
            print $"[provision] ($m.provider): no usable ($env_name) — skipped"
            continue
        }
        let psd = ({autoSync: true, autoFetchModels: true} | merge (extra-psd $m))
        let existing_auto = (find-auto $all $m.provider)

        if ($existing_auto | is-not-empty) {
            let cid = ($existing_auto | get -o id)
            let update_body = {
                apiKey: ($value | str trim)
                providerSpecificData: (($existing_auto | get -o providerSpecificData | default {}) | merge $psd)
            }
            mut success = false
            for upd_try in 1..5 {
                try {
                    http put --content-type application/json --headers $headers $"($base)/api/providers/($cid)" $update_body
                    print $"[provision] ($m.provider): connection ($cid) updated"
                    $success = true
                    break
                } catch {|err|
                    print $"[provision] ($m.provider): update attempt ($upd_try)/5 FAILED — ($err.msg | str substring 0..400)"
                    if $upd_try < 5 { sleep 2sec }
                }
            }
            if not $success {
                print $"[provision] ($m.provider): updating connection FAILED after 5 attempts"
            }
        } else {
            let body = {
                provider: $m.provider
                providerSpecificData: $psd
                entries: [{name: "auto", apiKey: ($value | str trim)}]
            }
            mut success = false
            for bulk_try in 1..5 {
                if $bulk_try > 1 {
                    let relisted = (try {
                        http get --headers $headers $"($base)/api/providers" | get -o connections | default []
                    } catch {|err|
                        print $"[provision] ($m.provider): re-list before retry FAILED — ($err.msg | str substring 0..400)"
                        null
                    })
                    if $relisted == null {
                        print $"[provision] ($m.provider): cannot confirm the previous create did not land — not retrying to avoid a duplicate connection"
                        break
                    }
                    $all = $relisted
                    if (find-auto $all $m.provider | is-not-empty) {
                        print $"[provision] ($m.provider): verified connection already created"
                        $success = true
                        break
                    }
                }
                try {
                    let res = (http post --content-type application/json --headers $headers $"($base)/api/providers/bulk" $body)
                    let errs = ($res | get -o errors | default [])
                    if ($errs | is-not-empty) {
                        let err_msg = ($errs | get 0 | get -o message | default "bulk entry error")
                        print $"[provision] ($m.provider): bulk create returned error — ($err_msg)"
                        if $bulk_try < 5 { sleep 2sec }
                    } else {
                        print $"[provision] ($m.provider): connection created"
                        $success = true
                        break
                    }
                } catch {|err|
                    print $"[provision] ($m.provider): attempt ($bulk_try)/5 FAILED — ($err.msg | str substring 0..400)"
                    if $bulk_try < 5 { sleep 2sec }
                }
            }
            if not $success {
                print $"[provision] ($m.provider): provisioning FAILED after 5 attempts"
            }
        }
    }

    try { restore-oauth $base $headers } catch {|err|
        print $"[provision] OAuth restore FAILED — ($err.msg | str substring 0..800)"
    }

    mut refreshed = false
    for list_try in 1..5 {
        try {
            $all = (http get --headers $headers $"($base)/api/providers" | get -o connections | default [])
            $refreshed = true
            break
        } catch {|err|
            print $"[provision] refresh connections attempt ($list_try)/5 FAILED — ($err.msg | str substring 0..800)"
            if $list_try < 5 { sleep 2sec }
        }
    }

    if not $refreshed {
        print "[provision] could not list connections — skipping sync & blocking"
        return
    }

    let allow = ($MAPPING | each {|m| $m.provider} | uniq)
    let enforce = (($env.BLOCK_FREE_PROVIDERS? | default "true" | str trim | str lowercase) not-in ["false" "0" "off" "no"])
    if not $enforce {
        print "[provision] BLOCK_FREE_PROVIDERS is off — providers outside MAPPING are not deactivated or blocked"
    }

    for conn in (if $enforce { $all | default [] } else { [] }) {
        let pname = ($conn | get -o provider | default "")
        let cid = ($conn | get -o id)
        let is_on = (($conn | get -o isActive | default false) == true)
        if not $is_on { continue }
        if ($pname in $allow) { continue }
        if ($cid | is-empty) { continue }
        for de_try in 1..5 {
            try {
                http put --content-type application/json --headers $headers $"($base)/api/providers/($cid)" {isActive: false}
                print $"[provision] '($pname)': not in MAPPING — deactivated"
                break
            } catch {|err|
                print $"[provision] '($pname)': deactivate attempt ($de_try)/5 FAILED — ($err.msg | str substring 0..800)"
                if $de_try < 5 { sleep 2sec }
            }
        }
    }

    let active = ($all | default [] | where {|c| (($c | get -o isActive | default false) == true) and (($c | get -o provider | default "") in $allow)})

    for conn in $active {
        let name = $conn | get -o name | default "?"
        let cid = $conn | get -o id
        if ($cid | is-empty) { continue }
        let psd = ($conn | get -o providerSpecificData | default {})
        let needs_auto_sync = (($psd | get -o autoSync | default false) != true)
        let needs_auto_fetch = (($psd | get -o autoFetchModels | default false) != true)
        let match_m = ($MAPPING | where {|x| $x.provider == ($conn | get -o provider)} | get -o 0)
        let extra = (if ($match_m | is-not-empty) { extra-psd $match_m } else { {} })
        let needs_extra = ($extra | items {|k, v| ($psd | get -o $k) != $v} | any {|x| $x})

        if $needs_auto_sync or $needs_auto_fetch or $needs_extra {
            mut updated = false
            for upd_try in 1..5 {
                try {
                    http put --content-type application/json --headers $headers $"($base)/api/providers/($cid)" {
                        providerSpecificData: ($psd | merge {autoSync: true, autoFetchModels: true} | merge $extra)
                    }
                    print $"[provision] '($name)': provider settings updated"
                    $updated = true
                    break
                } catch {|err|
                    print $"[provision] '($name)': updating provider settings attempt ($upd_try)/5 FAILED — ($err.msg | str substring 0..800)"
                    if $upd_try < 5 { sleep 2sec }
                }
            }
            if not $updated { continue }
        }
        mut synced = false
        for sync_try in 1..5 {
            try {
                http post --content-type application/json --headers $headers $"($base)/api/providers/($cid)/sync-models?mode=import" {}
                print $"[provision] '($name)': model catalog imported"
                $synced = true
                break
            } catch {|err|
                print $"[provision] '($name)': sync attempt ($sync_try)/5 FAILED — ($err.msg | str substring 0..800)"
                if $sync_try < 5 { sleep 2sec }
            }
        }
    }

    mut catalog_ids = []
    try {
        $catalog_ids = (
            http get --headers $headers $"($base)/api/models/catalog"
            | get -o catalog | default {}
            | columns
        )
        print $"[provision] catalog listed — ($catalog_ids | length) provider ids"
    } catch {|err|
        print $"[provision] catalog list FAILED — falling back to connection providers ($err.msg | str substring 0..800)"
    }
    let conn_providers = ($all | default [] | each {|c| $c | get -o provider | default ""} | where {|p| ($p | is-not-empty)} | uniq)
    mut free_ids = []
    try {
        $free_ids = (http get --headers $headers $"($base)/api/free-provider-rankings?limit=100" | get -o rankings | default [] | each {|r| $r | get -o id | default ""})
        print $"[provision] free providers listed — ($free_ids | length) provider ids"
    } catch {|err|
        print $"[provision] free providers list FAILED — ($err.msg | str substring 0..200)"
    }
    let denylist = ($allow | append ["auto", "unknown"] | uniq)
    let blocked = ($catalog_ids | append $conn_providers | append $free_ids | where {|p| ($p | is-not-empty)} | uniq | where {|p| $p not-in $denylist})

    mut done = false
    for blk_try in 1..5 {
        try {
            let current = (http get --headers $headers $"($base)/api/settings" | get -o blockedProviders | default [])
            let merged = (if $enforce { $current | append $blocked | uniq | where {|p| $p not-in $denylist} } else { [] })
            if ($merged | sort) == ($current | sort) {
                print $"[provision] blocking unchanged — ($merged | length) provider entries"
            } else {
                http patch --content-type application/json --headers $headers $"($base)/api/settings" {blockedProviders: $merged}
                print $"[provision] blockedProviders set to ($merged | length) entries"
            }
            $done = true
            break
        } catch {|err|
            print $"[provision] blocking attempt ($blk_try)/5 FAILED — ($err.msg | str substring 0..800)"
            if $blk_try < 5 { sleep 2sec }
        }
    }
    if not $done {
        error make { msg: "blocking providers failed after 5 attempts" }
    }

    let visible = ($VISIBLE_MODELS | items {|p, ms| $ms | columns | each {|id| $"($p)/($id)"}} | flatten)
    mut vis_done = false
    for vis_try in 1..5 {
        try {
            let current = (http get --headers $headers $"($base)/api/settings" | get -o modelVisibilityAllowlist | default [])
            if ($visible | sort) == ($current | sort) {
                print $"[provision] model allowlist unchanged — ($visible | length) models"
            } else {
                http patch --content-type application/json --headers $headers $"($base)/api/settings" {modelVisibilityAllowlist: $visible}
                print $"[provision] modelVisibilityAllowlist set to ($visible | length) models"
            }
            $vis_done = true
            break
        } catch {|err|
            print $"[provision] model allowlist attempt ($vis_try)/5 FAILED — ($err.msg | str substring 0..800)"
            if $vis_try < 5 { sleep 2sec }
        }
    }
    if not $vis_done {
        error make { msg: "setting the model allowlist failed after 5 attempts" }
    }

    let wanted = ($VISIBLE_MODELS | items {|p, ms|
        $ms | items {|id, meta|
            $OVERRIDE_KEYS | where {|k| ($meta | get -o $k.field) != null} | each {|k|
                {target: $"($p)/($id)", key: $k.key, value: ($meta | get $k.field)}
            }
        } | flatten
    } | flatten)
    mut ovr_done = false
    for ovr_try in 1..5 {
        try {
            let current = (http get --headers $headers $"($base)/api/model-capability-overrides" | get -o overrides | default [])
            let pending = ($wanted | where {|w| ($current | where {|c| $c.target == $w.target and $c.key == $w.key and $c.value == $w.value} | is-empty)})
            for w in $pending {
                let value = (if $w.key == "reasoning_efforts" { $w.value | str join "," } else { $w.value })
                http patch --content-type application/json --headers $headers $"($base)/api/model-capability-overrides" {target: $w.target, key: $w.key, value: $value}
                print $"[provision] override ($w.target) ($w.key) set to ($w.value | to nuon)"
            }
            let stale = ($current | where {|c| ($wanted | where {|w| $w.target == $c.target and $w.key == $c.key} | is-empty)})
            for c in $stale {
                http delete --headers $headers $"($base)/api/model-capability-overrides?({target: $c.target, key: $c.key} | url build-query)"
                print $"[provision] override ($c.target) ($c.key) removed — not in VISIBLE_MODELS"
            }
            print $"[provision] model overrides in sync — ($wanted | length) entries, ($pending | length) changed, ($stale | length) removed"
            $ovr_done = true
            break
        } catch {|err|
            print $"[provision] model overrides attempt ($ovr_try)/5 FAILED — ($err.msg | str substring 0..800)"
            if $ovr_try < 5 { sleep 2sec }
        }
    }
    if not $ovr_done {
        error make { msg: "applying model overrides failed after 5 attempts" }
    }

    mut existing_combos = []
    for combo_list_try in 1..5 {
        try {
            $existing_combos = (http get --headers $headers $"($base)/api/combos" | get -o combos | default [])
            break
        } catch {|err|
            print $"[provision] list combos attempt ($combo_list_try)/5 FAILED — ($err.msg | str substring 0..800)"
            if $combo_list_try < 5 { sleep 2sec }
        }
    }

    for mc in $MODEL_COMBOS {
        let matches = ($existing_combos | where {|c| ($c | get -o name | default "") == $mc.name})
        let body = {
            name: $mc.name
            strategy: "priority"
            models: [$mc.target]
        }
        if ($matches | is-not-empty) {
            let cid = (($matches | get 0) | get -o id)
            mut updated = false
            for upd_try in 1..5 {
                try {
                    http put --content-type application/json --headers $headers $"($base)/api/combos/($cid)" $body
                    print $"[provision] combo '($mc.name)': updated"
                    $updated = true
                    break
                } catch {|err|
                    print $"[provision] combo '($mc.name)': update attempt ($upd_try)/5 FAILED — ($err.msg | str substring 0..800)"
                    if $upd_try < 5 { sleep 2sec }
                }
            }
            if not $updated {
                print $"[provision] combo '($mc.name)': update FAILED after 5 attempts"
            }
        } else {
            mut created = false
            for crt_try in 1..5 {
                try {
                    http post --content-type application/json --headers $headers $"($base)/api/combos" $body
                    print $"[provision] combo '($mc.name)': created"
                    $created = true
                    break
                } catch {|err|
                    print $"[provision] combo '($mc.name)': create attempt ($crt_try)/5 FAILED — ($err.msg | str substring 0..800)"
                    if $crt_try < 5 { sleep 2sec }
                }
            }
            if not $created {
                print $"[provision] combo '($mc.name)': creation FAILED after 5 attempts"
            }
        }
    }
}

mut healthy = false
for i in 1..120 {
    print $"[provision] healthcheck attempt ($i)/120"
    if ((^node /app/healthcheck.mjs | complete).exit_code == 0) {
        print "[provision] healthcheck passed"
        $healthy = true
        break
    }
    sleep 1sec
}

if not $healthy {
    print "[provision] server not healthy after 120s — giving up"
    "" | save -f /tmp/provision.failed
    exit 1
}

print "[provision] waiting 5sec for API to become ready..."
sleep 5sec

try {
    do-provision
    "" | save -f /tmp/provision.done
    print "[provision] completed successfully"
} catch {|err|
    "" | save -f /tmp/provision.failed
    print -e $"[provision] failed — ($err.msg | str substring 0..800)"
    print -e $"[provision] debug ($err.debug | str substring 0..1200)"
}
'''
