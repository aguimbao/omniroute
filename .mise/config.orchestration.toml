[tools]
pitchfork = '2.23.0'

[tasks.up]
description = 'Create stack resources and start daemons via pitchfork. Supports pull/build and test isolation'
shell = 'nu -c'
usage = '''
flag "-b --build" help="Build Omniroute image locally instead of pulling"
flag "-n --no-cache" help="Bypass cache for local image build"
flag "-t --test" help="Use test isolated stack (omniroute-test-*)"
flag "-f --force-restart" help="Restart daemons if already running"
'''
run = '''
const OMNIROUTE_IMAGE = "ghcr.io/aguimbao/omniroute:latest@sha256:41f564f53f9717850ecad8a948f07c776616a1ead79875342b28c0b34d832406"

def volume-exists [name: string] {
  (podman volume inspect $name | complete | get exit_code) == 0
}

def network-exists [name: string] {
  (podman network inspect $name | complete | get exit_code) == 0
}

def image-exists [name: string] {
  (podman image exists $name | complete | get exit_code) == 0
}

let build_requested = (($env.usage_build? | default "false") == "true")
let no_cache = (($env.usage_no_cache? | default "false") == "true")
let is_test = (($env.usage_test? | default "false") == "true")
let is_force = (($env.usage_force_restart? | default "false") == "true")
let force_args = if $is_force { ["--force"] } else { [] }

let target_img = if $is_test { "localhost/omniroute:test" } else { "localhost/omniroute:latest" }

if $build_requested {
  let build_flags = if $no_cache { ["--no-cache"] } else { [] }
  let secret_flags = if ($env.GITHUB_TOKEN? | is-not-empty) {
    ["--secret", "id=GITHUB_TOKEN,env=GITHUB_TOKEN"]
  } else { [] }
  podman build ...$build_flags ...$secret_flags --format docker -t $target_img .
} else {
  if not (image-exists $OMNIROUTE_IMAGE) {
    podman pull $OMNIROUTE_IMAGE
  }
  podman tag $OMNIROUTE_IMAGE $target_img
}

if $is_test {
  if not (volume-exists omniroute-test-app-data) {
    podman volume create omniroute-test-app-data
  }

  if not (volume-exists omniroute-test-redis-data) {
    podman volume create omniroute-test-redis-data
  }

  if not (network-exists omniroute-test-net) {
    podman network create omniroute-test-net
  }
} else {
  if not (volume-exists omniroute-app-data) {
    podman volume create omniroute-app-data
  }

  if not (volume-exists omniroute-redis-data) {
    podman volume create omniroute-redis-data
  }

  if not (network-exists omniroute-net) {
    podman network create omniroute-net
  }
}

let status = (
    pitchfork supervisor status --json
    | from json
    | get status
)

if $status != "up" {
    pitchfork supervisor start
}

if $is_test {
  pitchfork start ...$force_args omniroute-test-redis omniroute-test-app
} else {
  pitchfork start ...$force_args omniroute-redis omniroute-app
}
'''

[tasks.down]
description = 'Stop daemons via pitchfork. Optional resource removal'
shell = 'nu -c'
usage = '''
flag "-p --prune" help="Remove network, images and containers after stopping"
flag "-v --volumes" help="Also remove volumes (requires --prune)"
flag "-t --test" help="Target test stack (omniroute-test-*)"
'''
run = '''
def container-exists [name: string] {
  (podman container exists $name | complete | get exit_code) == 0
}

def image-exists [name: string] {
  (podman image exists $name | complete | get exit_code) == 0
}

def network-exists [name: string] {
  (podman network inspect $name | complete | get exit_code) == 0
}

def volume-exists [name: string] {
  (podman volume inspect $name | complete | get exit_code) == 0
}

let prune_requested = (($env.usage_prune? | default "false") == "true")
let volumes_requested = (($env.usage_volumes? | default "false") == "true")
let is_test = (($env.usage_test? | default "false") == "true")

if $volumes_requested and not $prune_requested {
  error make {
    msg: "--volumes requires --prune"
  }
}

let status = (
    pitchfork supervisor status --json
    | from json
    | get status
)

if $status != "up" {
    pitchfork supervisor start
}

if $is_test {
  pitchfork stop omniroute-test-app omniroute-test-redis

  if $prune_requested {
    for name in [omniroute-test-app omniroute-test-redis] {
      if (container-exists $name) {
        podman rm --force --time 40 $name
      }
    }

    if (network-exists omniroute-test-net) {
      podman network rm omniroute-test-net
    }

    if (image-exists localhost/omniroute:test) {
      podman image rm localhost/omniroute:test
    }

    if $volumes_requested {
      for name in [omniroute-test-app-data omniroute-test-redis-data] {
        if (volume-exists $name) {
          podman volume rm $name
        }
      }
    }

    podman image prune --force
  }
} else {
  pitchfork stop omniroute-app omniroute-redis

  if $prune_requested {
    for name in [omniroute-app omniroute-redis] {
      if (container-exists $name) {
        podman rm --force --time 40 $name
      }
    }

    if (network-exists omniroute-net) {
      podman network rm omniroute-net
    }

    if (image-exists localhost/omniroute:latest) {
      podman image rm localhost/omniroute:latest
    }

    if $volumes_requested {
      for name in [omniroute-app-data omniroute-redis-data] {
        if (volume-exists $name) {
          podman volume rm $name
        }
      }
    }

    podman image prune --force
  }
}
'''

[tasks.test]
description = 'Run full stack test and teardown. Builds test image by default or pulls from registry with --no-build'
shell = 'nu -c'
usage = '''
flag "-n --no-build" help="Pull Omniroute image from registry instead of building locally"
'''
run = '''
let no_build = (($env.usage_no_build? | default "false") == "true")
let test_result = try {
  if $no_build {
    mise run up --test --force-restart
  } else {
    mise run up --build --no-cache --test --force-restart
  }
  print "[test] stack up — waiting for healthcheck"
  podman healthcheck run omniroute-test-app
  print "[test] stack healthy — waiting for provisioning"
  mut prov_done = false
  for _ in 1..45 {
    if ((podman exec omniroute-test-app test -f /tmp/provision.failed | complete).exit_code == 0) {
      error make { msg: "provisioning failed inside container" }
    }
    if ((podman exec omniroute-test-app test -f /tmp/provision.done | complete).exit_code == 0) {
      $prov_done = true
      break
    }
    sleep 1sec
  }
  if not $prov_done {
    error make { msg: "provisioning timed out after 45s" }
  }
  print "[test] provisioning healthy"
  0
} catch {|err|
  print -e $"[test] failed: ($err.msg)"
  1
}

let teardown = (mise run down --prune --volumes --test | complete)
if $teardown.exit_code != 0 {
  print -e "[test] teardown failed"
  print -e $teardown.stderr
}

if $test_result != 0 {
  exit $test_result
}

if $teardown.exit_code != 0 {
  exit $teardown.exit_code
}
'''
